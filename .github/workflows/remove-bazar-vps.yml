name: Remove bazar-deals from VPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remove-bazar-deals-vps
  cancel-in-progress: false

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure pinned SSH access
        env:
          CONDENS_SSH_PRIVATE_KEY: ${{ secrets.CONDENS_SSH_PRIVATE_KEY }}
          CONDENS_SSH_USER: ${{ secrets.CONDENS_SSH_USER }}
        run: |
          : "${CONDENS_SSH_PRIVATE_KEY:?missing CONDENS_SSH_PRIVATE_KEY}"
          : "${CONDENS_SSH_USER:?missing CONDENS_SSH_USER}"
          install -m 700 -d ~/.ssh
          python - <<'PY'
          import os
          import textwrap
          from pathlib import Path

          value = os.environ["CONDENS_SSH_PRIVATE_KEY"].strip()
          header = "-----BEGIN OPENSSH PRIVATE KEY-----"
          footer = "-----END OPENSSH PRIVATE KEY-----"
          if not value.startswith(header) or not value.endswith(footer):
              raise SystemExit("invalid OpenSSH key envelope")
          body = "".join(value[len(header):-len(footer)].split())
          target = Path.home() / ".ssh" / "condens"
          target.write_text(
              header + "\n" + "\n".join(textwrap.wrap(body, 70)) + "\n" + footer + "\n",
              encoding="ascii",
          )
          target.chmod(0o600)
          PY
          printf '%s\n' \
            '46.102.157.230 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBxLpy7QeOJdsskTztHiHYPEJgb9ZUhsynBtvY+sBcbO' \
            > ~/.ssh/known_hosts
      - name: Remove only the bazar-deals deployment
        env:
          CONDENS_SSH_USER: ${{ secrets.CONDENS_SSH_USER }}
        run: |
          ssh -i ~/.ssh/condens -o BatchMode=yes "${CONDENS_SSH_USER}@46.102.157.230" <<'EOF'
          set -eu
          project=/opt/bazar-deals
          compose="$project/deploy/ebay-store/compose.yml"

          test -d "$project"
          test -f "$compose"
          test "$(realpath "$project")" = "$project"

          echo 'Before removal:'
          du -sh "$project"
          docker compose -f "$compose" ps -a || true
          docker ps --format '{{.Names}} {{.Image}}' | grep -F 'polymarket-tracker' || true

          docker compose -f "$compose" down --rmi local
          rm -rf -- "$project"

          test ! -e "$project"
          test -z "$(docker ps -a --filter name=ebay-store --format '{{.Names}}')"

          echo 'After removal: preserved services:'
          docker ps --format '{{.Names}} {{.Image}}' | grep -F 'polymarket-tracker' || true
          docker image inspect caddy:2 --format '{{.RepoTags}} {{.Size}}' || true
          echo 'bazar-deals deployment removed'
          EOF
