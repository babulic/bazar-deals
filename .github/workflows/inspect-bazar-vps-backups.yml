name: Inspect bazar-deals VPS backups

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inspect-bazar-deals-vps-backups
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure pinned SSH access
        env:
          CONDENS_SSH_PRIVATE_KEY: ${{ secrets.CONDENS_SSH_PRIVATE_KEY }}
          CONDENS_SSH_USER: ${{ secrets.CONDENS_SSH_USER }}
        run: |
          : "${CONDENS_SSH_PRIVATE_KEY:?missing CONDENS_SSH_PRIVATE_KEY}"
          : "${CONDENS_SSH_USER:?missing CONDENS_SSH_USER}"
          install -m 700 -d ~/.ssh
          python - <<'PY'
          import os
          import textwrap
          from pathlib import Path

          value = os.environ["CONDENS_SSH_PRIVATE_KEY"].strip()
          header = "-----BEGIN OPENSSH PRIVATE KEY-----"
          footer = "-----END OPENSSH PRIVATE KEY-----"
          if not value.startswith(header) or not value.endswith(footer):
              raise SystemExit("invalid OpenSSH key envelope")
          body = "".join(value[len(header):-len(footer)].split())
          target = Path.home() / ".ssh" / "condens"
          target.write_text(
              header + "\n" + "\n".join(textwrap.wrap(body, 70)) + "\n" + footer + "\n",
              encoding="ascii",
          )
          target.chmod(0o600)
          PY
          printf '%s\n' \
            '46.102.157.230 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBxLpy7QeOJdsskTztHiHYPEJgb9ZUhsynBtvY+sBcbO' \
            > ~/.ssh/known_hosts
      - name: List project-labelled backup candidates
        env:
          CONDENS_SSH_USER: ${{ secrets.CONDENS_SSH_USER }}
        run: |
          ssh -i ~/.ssh/condens -o BatchMode=yes "${CONDENS_SSH_USER}@46.102.157.230" <<'EOF'
          set -eu
          sudo -n true
          echo 'Files and directories labelled for bazar-deals or ebay-store:'
          sudo -n find / -xdev \
            \( -path /proc -o -path /sys -o -path /dev -o -path /run \) -prune -o \
            \( -iname '*bazar-deals*' -o -iname '*bazar_deals*' -o -iname '*ebay-store*' \) \
            -printf '%y %s %p\n' 2>/dev/null || true
          echo 'Docker volumes labelled for the project:'
          docker volume ls --format '{{.Name}}' | grep -Ei 'bazar|ebay-store' || true
          echo 'Docker images labelled for the project:'
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.Size}}' | grep -Ei 'bazar|ebay-store' || true
          echo 'Docker containers labelled for the project:'
          docker ps -a --format '{{.Names}} {{.Image}}' | grep -Ei 'bazar|ebay-store' || true
          EOF
