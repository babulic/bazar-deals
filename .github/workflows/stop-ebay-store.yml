name: Stop bazar-deals VPS service

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stop-bazar-deals-vps
  cancel-in-progress: false

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned SSH access
        env:
          CONDENS_SSH_PRIVATE_KEY: ${{ secrets.CONDENS_SSH_PRIVATE_KEY }}
          CONDENS_SSH_USER: ${{ secrets.CONDENS_SSH_USER }}
        run: |
          : "${CONDENS_SSH_PRIVATE_KEY:?missing CONDENS_SSH_PRIVATE_KEY}"
          : "${CONDENS_SSH_USER:?missing CONDENS_SSH_USER}"
          install -m 700 -d ~/.ssh
          python - <<'PY'
          import os
          import textwrap
          from pathlib import Path

          value = os.environ["CONDENS_SSH_PRIVATE_KEY"].strip()
          header = "-----BEGIN OPENSSH PRIVATE KEY-----"
          footer = "-----END OPENSSH PRIVATE KEY-----"
          if not value.startswith(header) or not value.endswith(footer):
              raise SystemExit("invalid OpenSSH key envelope")
          body = "".join(value[len(header):-len(footer)].split())
          target = Path.home() / ".ssh" / "condens"
          target.write_text(
              header + "\n" + "\n".join(textwrap.wrap(body, 70)) + "\n" + footer + "\n",
              encoding="ascii",
          )
          target.chmod(0o600)
          PY
          cat > ~/.ssh/known_hosts <<'EOF'
          46.102.157.230 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBxLpy7QeOJdsskTztHiHYPEJgb9ZUhsynBtvY+sBcbO
          EOF
      - name: Stop bazar-deals containers without deleting data
        env:
          CONDENS_SSH_USER: ${{ secrets.CONDENS_SSH_USER }}
        run: |
          ssh -i ~/.ssh/condens \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$CONDENS_SSH_USER@46.102.157.230" \
            'cd /opt/bazar-deals && docker compose -f deploy/ebay-store/compose.yml stop && docker compose -f deploy/ebay-store/compose.yml ps'
      - name: Confirm public endpoint is stopped
        run: |
          if curl --fail --silent --show-error --max-time 15 https://46-102-157-230.sslip.io/health; then
            echo "bazar-deals health endpoint still answers" >&2
            exit 1
          fi
          echo "bazar-deals health endpoint is stopped"
