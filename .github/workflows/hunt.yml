name: Hunt alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  copilot-requests: write

# Do not cancel an in-progress hunt: the 0-BUY loop runs inside the score
# step. Queue the next hour instead of dropping that retry.
concurrency:
  group: hunt-alerts
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      buys: ${{ steps.score.outputs.buys }}
      looped: ${{ steps.score.outputs.looped }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure bazar-alert label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create bazar-alert \
            --repo "${{ github.repository }}" \
            --description "Automatické hunt alerty" \
            --color D93F0B \
            --force
      - uses: actions/cache@v4
        with:
          path: .cache/bazar-comps-v2.sqlite
          key: sold-comps-fx-v3-${{ github.run_id }}
          restore-keys: |
            sold-comps-fx-v3-
      - uses: actions/cache@v4
        with:
          path: .cache/ecb-fx.json
          key: ecb-fx-hunt-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ecb-fx-
      - run: python -m pip install -e .
      - name: Install Copilot CLI for final AI verification
        run: npm install -g @github/copilot
      - name: Ensure price book DB exists
        env:
          COMPS_DB: .cache/bazar-comps-v2.sqlite
        run: python -c "from bazar_deals.soldcomps import SoldCompClient; SoldCompClient()"
      - name: Fetch Bazos
        continue-on-error: true
        run: python -u -m bazar_deals hunt --source bazos --fetch-only --listings-out .cache/hunt-bazos.json
        env:
          PYTHONUNBUFFERED: "1"
          COMPS_DB: .cache/bazar-comps-v2.sqlite
      - name: Fetch Aukro
        continue-on-error: true
        run: python -u -m bazar_deals hunt --source aukro --fetch-only --listings-out .cache/hunt-aukro.json
        env:
          PYTHONUNBUFFERED: "1"
          COMPS_DB: .cache/bazar-comps-v2.sqlite
      - name: Fetch Vinted
        continue-on-error: true
        run: python -u -m bazar_deals hunt --source vinted --fetch-only --listings-out .cache/hunt-vinted.json
        env:
          PYTHONUNBUFFERED: "1"
          COMPS_DB: .cache/bazar-comps-v2.sqlite
      - name: Fetch sbazar
        continue-on-error: true
        run: python -u -m bazar_deals hunt --source sbazar --fetch-only --listings-out .cache/hunt-sbazar.json
        env:
          PYTHONUNBUFFERED: "1"
          COMPS_DB: .cache/bazar-comps-v2.sqlite
      - name: Fetch eBay
        continue-on-error: true
        run: python -u -m bazar_deals hunt --source ebay --fetch-only --listings-out .cache/hunt-ebay.json
        env:
          PYTHONUNBUFFERED: "1"
          COMPS_DB: .cache/bazar-comps-v2.sqlite
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_RETENTION_ENABLED: "true"
      - name: Fetch Facebook
        continue-on-error: true
        run: python -u -m bazar_deals hunt --source facebook --fetch-only --listings-out .cache/hunt-facebook.json
        env:
          PYTHONUNBUFFERED: "1"
          COMPS_DB: .cache/bazar-comps-v2.sqlite
      - name: Fetch OLX
        continue-on-error: true
        run: python -u -m bazar_deals hunt --source olx --fetch-only --listings-out .cache/hunt-olx.json
        env:
          PYTHONUNBUFFERED: "1"
          COMPS_DB: .cache/bazar-comps-v2.sqlite
      - name: Score, 0-BUY loop, and comment
        id: score
        run: python -u -m bazar_deals hunt --listings-in .cache/hunt-bazos.json --listings-in .cache/hunt-aukro.json --listings-in .cache/hunt-vinted.json --listings-in .cache/hunt-sbazar.json --listings-in .cache/hunt-ebay.json --listings-in .cache/hunt-facebook.json --listings-in .cache/hunt-olx.json --notify
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ALERT_ISSUE: "1"
          GITHUB_ASSIGNEE: babulic
          MAX_BUY_EUR: "110"
          EUR_CZK: ${{ vars.EUR_CZK }}
          EUR_PLN: ${{ vars.EUR_PLN }}
          MIN_BUY_EUR: "20"
          MIN_NET_PROFIT_EUR: "30"
          MAX_SHIPPING_EUR: "15"
          CHEAP_BUY_EUR: "20"
          MAX_SHIPPING_CHEAP_EUR: "11"
          RESALE_FEE_RATE: "0.10"
          SELLER_RISK_RESERVE_RATE: "0.05"
          NO_BOX_HAIRCUT_EUR: "5"
          COMPS_DB: .cache/bazar-comps-v2.sqlite
          COMPS_TTL_DAYS: "7"
          COMPS_LIVE_QUERIES: "80"
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_RETENTION_ENABLED: "true"
          AI_PROVIDER: copilot
          COPILOT_MODEL: auto
          AI_REVIEW_ENABLED: "true"
          AI_REVIEW_REQUIRED: "true"
          AI_MAX_REVIEWS: "8"
          AI_MAX_IDENTIFICATIONS: "12"
          AI_REVIEW_TTL_DAYS: "14"
          AI_MIN_CONFIDENCE: "0.75"
      - name: Keep first-hunt listings for the 0 BUY retry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunt-listings
          path: .cache/hunt-*.json
          if-no-files-found: ignore
          retention-days: 1

  research:
    needs: hunt
    # Backup only: the hunt score step already loops in-process when buys=0.
    # Run this job if the hunt died before it could loop (buys/looped empty).
    if: ${{ always() && (needs.hunt.outputs.buys == '0' || needs.hunt.outputs.buys == '') && needs.hunt.outputs.looped != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache/bazar-comps-v2.sqlite
          key: sold-comps-fx-v3-${{ github.run_id }}
          restore-keys: |
            sold-comps-fx-v3-
      - uses: actions/cache@v4
        with:
          path: .cache/ecb-fx.json
          key: ecb-fx-hunt-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ecb-fx-
      - run: python -m pip install -e .
      - name: Install Copilot CLI for final AI verification
        run: npm install -g @github/copilot
      - name: Reuse first-hunt listings
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hunt-listings
          path: .cache
      - name: Research retry after 0 BUY
        run: python -u -m bazar_deals hunt --research --notify --listings-in .cache/hunt-bazos.json --listings-in .cache/hunt-aukro.json --listings-in .cache/hunt-vinted.json --listings-in .cache/hunt-sbazar.json --listings-in .cache/hunt-ebay.json --listings-in .cache/hunt-facebook.json --listings-in .cache/hunt-olx.json
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ALERT_ISSUE: "1"
          GITHUB_ASSIGNEE: babulic
          MAX_BUY_EUR: "110"
          EUR_CZK: ${{ vars.EUR_CZK }}
          EUR_PLN: ${{ vars.EUR_PLN }}
          MIN_BUY_EUR: "20"
          MIN_NET_PROFIT_EUR: "30"
          MAX_SHIPPING_EUR: "15"
          CHEAP_BUY_EUR: "20"
          MAX_SHIPPING_CHEAP_EUR: "11"
          RESALE_FEE_RATE: "0.10"
          SELLER_RISK_RESERVE_RATE: "0.05"
          NO_BOX_HAIRCUT_EUR: "5"
          COMPS_DB: .cache/bazar-comps-v2.sqlite
          COMPS_TTL_DAYS: "7"
          COMPS_LIVE_QUERIES: "80"
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_RETENTION_ENABLED: "true"
          AI_PROVIDER: copilot
          COPILOT_MODEL: auto
          AI_REVIEW_ENABLED: "true"
          AI_REVIEW_REQUIRED: "true"
          AI_MAX_REVIEWS: "8"
          AI_MAX_IDENTIFICATIONS: "12"
          AI_REVIEW_TTL_DAYS: "14"
          AI_MIN_CONFIDENCE: "0.75"
