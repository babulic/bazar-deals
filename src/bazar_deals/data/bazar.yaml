# All hunt lists, maps, and numeric defaults.
# Secrets stay in .env (tokens, API keys). Optional overlay: ./bazar.yaml or BAZAR_CONFIG.

domain:
  marketplaces: [ebay, aukro, bazos, vinted]
  verticals: [retro, mineral, apple, network]
  conditions: [new, like_new, used, for_parts, unknown]
  actions: [buy, alert, skip]
  default_currency: EUR

hunt:
  max_buy_eur: 60
  max_price_vs_typical: 1.0
  min_sold_sample: 5
  max_sold_lookups: 40
  default_shipping_eur: 8
  min_net_profit_eur: 20
  min_margin: 0.25
  eur_czk: 24.5
  eur_usd: 1.08
  user_agent: "bazar-deals/0.1 (+https://github.com/babulic/bazar-deals)"
  request_gap_seconds: 2.0

github:
  alert_issue_title: Deal alerts
  alert_label: bazar-alert
  alert_issue: 0
  assignee: ""

fees:
  rates:
    ebay: 0.13
    aukro: 0.11
    bazos: 0
    vinted: 0.05
  buy_side: [vinted]
  vinted_fixed_eur: 0.70

