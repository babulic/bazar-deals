name: Sell buyer alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "30 * * * *"
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  sell-buyers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      buyers: ${{ steps.sell.outputs.buyers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure bazar-sell label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create bazar-sell \
            --repo "${{ github.repository }}" \
            --description "Kupci na vlastný tovar" \
            --color 0E8A16 \
            --force
      - uses: actions/cache@v4
        with:
          path: .cache/ecb-fx.json
          key: ecb-fx-sell-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ecb-fx-
      - run: python -m pip install -e .
      - name: Find buyers for own stock
        id: sell
        run: python -m bazar_deals sell --buyers --notify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ASSIGNEE: babulic
          GITHUB_SELL_ALERT_ISSUE: ${{ vars.GITHUB_SELL_ALERT_ISSUE }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_RETENTION_ENABLED: "true"
          ALLEGRO_ACCESS_TOKEN: ${{ secrets.ALLEGRO_ACCESS_TOKEN }}
          ALLEGRO_CLIENT_ID: ${{ secrets.ALLEGRO_CLIENT_ID }}
          ALLEGRO_CLIENT_SECRET: ${{ secrets.ALLEGRO_CLIENT_SECRET }}
          ALLEGRO_LISTING_ACCESS_CONFIRMED: ${{ vars.ALLEGRO_LISTING_ACCESS_CONFIRMED || 'false' }}
          EUR_CZK: ${{ vars.EUR_CZK }}
          EUR_PLN: ${{ vars.EUR_PLN }}
          VINTED_ACCESS_KEY: ${{ secrets.VINTED_ACCESS_KEY }}
          VINTED_SIGNING_KEY: ${{ secrets.VINTED_SIGNING_KEY }}

  research:
    needs: sell-buyers
    if: needs.sell-buyers.result == 'success' && needs.sell-buyers.outputs.buyers == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache/ecb-fx.json
          key: ecb-fx-sell-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ecb-fx-
      - run: python -m pip install -e .
      - name: Research retry after 0 buyers
        run: python -m bazar_deals sell --buyers --research --notify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ASSIGNEE: babulic
          GITHUB_SELL_ALERT_ISSUE: ${{ vars.GITHUB_SELL_ALERT_ISSUE }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_RETENTION_ENABLED: "true"
          ALLEGRO_ACCESS_TOKEN: ${{ secrets.ALLEGRO_ACCESS_TOKEN }}
          ALLEGRO_CLIENT_ID: ${{ secrets.ALLEGRO_CLIENT_ID }}
          ALLEGRO_CLIENT_SECRET: ${{ secrets.ALLEGRO_CLIENT_SECRET }}
          ALLEGRO_LISTING_ACCESS_CONFIRMED: ${{ vars.ALLEGRO_LISTING_ACCESS_CONFIRMED || 'false' }}
          EUR_CZK: ${{ vars.EUR_CZK }}
          EUR_PLN: ${{ vars.EUR_PLN }}
          VINTED_ACCESS_KEY: ${{ secrets.VINTED_ACCESS_KEY }}
          VINTED_SIGNING_KEY: ${{ secrets.VINTED_SIGNING_KEY }}
