selling:
  # Own seller accounts, keyed by the identifier each collector needs.
  accounts:
    bazos: "0948244165"
    aukro: ivqo
    # The public offer search filters by the numeric id, not the login.
    aukro_seller_id: 101485136
    vinted: "312914388"
    ebay: berg-kristalle

  # Slovakia plus the neighbours and the adjacent Schengen countries Packeta
  # serves from a Slovak business account.
  target_countries: [SK, CZ, PL, HU, AT, DE, SI, RO, HR]

  # Above this share of the asking price, cross-border postage stops a sale, so
  # the item is worth exporting only bundled with something else.
  max_shipping_ratio: 0.35

  # An eBay listing charging more than this above the real Packeta cost is
  # losing sales to its own postage line.
  overcharge_flag_eur: 3

  # Hard title caps. Bazos and eBay are confirmed by mid-word truncation in the
  # live listings; Vinted and Aukro are the longest titles observed there, so
  # they are lower bounds rather than proven caps.
  title_limits:
    bazos: 60
    ebay: 80
    vinted: 100
    aukro: 100

  # Segment drives who the buyer is, and therefore the channel and title shape.
  segments:
    minerals:
      keywords:
        - ametyst
        - amethyst
        - kryštál
        - krystal
        - kremeň
        - kremen
        - chalcedón
        - chalcedon
        - kalcit
        - galenit
        - sfalerit
        - chalkopyrit
        - pyrit
        - malachit
        - pseudomalachit
        - topaz
        - topás
        - apatit
        - celestín
        - celestin
        - jaspis
        - jadeit
        - zeolit
        - natrolit
        - skolecit
        - analcím
        - analcim
        - muskovit
        - fluorit
