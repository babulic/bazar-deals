name: Hunt alerts

on:
  workflow_dispatch:
    inputs:
      continuation:
        description: Continue the persisted Alwyzon batch
        type: boolean
        default: false
  schedule:
    - cron: "0 */2 * * *"

permissions:
  actions: write
  contents: read
  issues: write
  copilot-requests: write

# Every run owns one persisted Alwyzon page. A successful run saves its
# monotonic offset before dispatching the next run from main immediately.
# The two-hour schedule recovers the chain if a dispatch is lost.
concurrency:
  group: hunt-alerts
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    outputs:
      buys: ${{ steps.score.outputs.buys }}
      batch_complete: ${{ steps.score.outputs.batch_complete }}
      dispatch_next: ${{ steps.score.outputs.dispatch_next }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure bazar-alert label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create bazar-alert \
            --repo "${{ github.repository }}" \
            --description "Automatické hunt alerty" \
            --color D93F0B \
            --force
      - uses: actions/cache/restore@v4
        with:
          path: .cache/bazar-comps-v2.sqlite
          key: sold-comps-fx-v3-${{ github.run_id }}
          restore-keys: |
            sold-comps-fx-v3-
      - uses: actions/cache/restore@v4
        with:
          path: .cache/ecb-fx.json
          key: ecb-fx-hunt-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ecb-fx-
      - run: python -m pip install -e .
      - name: Install Copilot CLI for final AI verification
        run: npm install -g @github/copilot
      - name: Export hunt page budget from catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          from bazar_deals.rules import rules
          hunt, ai = rules()["hunt"], rules()["ai"]
          Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8").write(
              f"MAX_SCORE_LISTINGS={hunt['max_score_listings']}\n"
              f"AI_MAX_REVIEWS={ai['max_reviews']}\n"
              f"AI_MAX_IDENTIFICATIONS={ai['max_identifications']}\n"
              f"COMPS_LIVE_QUERIES={hunt['max_sold_lookups']}\n"
          )
          PY
      - name: Ensure price book DB exists
        env:
          COMPS_DB: .cache/bazar-comps-v2.sqlite
        run: python -c "from bazar_deals.soldcomps import SoldCompClient; SoldCompClient()"
      - name: Check persisted hunt batch
        id: batch
        env:
          HUNT_BATCH_URL: ${{ vars.EBAY_STORE_URL }}
          HUNT_BATCH_TOKEN: ${{ secrets.EBAY_STORE_TOKEN }}
        run: python -m bazar_deals hunt --batch-url "$HUNT_BATCH_URL" --batch-status
      - name: Fetch Bazos
        if: steps.batch.outputs.needs_fetch == '1'
        continue-on-error: true
        run: python -u -m bazar_deals hunt --source bazos --fetch-only --listings-out .cache/hunt-bazos.json
        env:
          PYTHONUNBUFFERED: "1"
          COMPS_DB: .cache/bazar-comps-v2.sqlite
      - name: Fetch Aukro
        if: steps.batch.outputs.needs_fetch == '1'
        continue-on-error: true
        run: python -u -m bazar_deals hunt --source aukro --fetch-only --listings-out .cache/hunt-aukro.json
        env:
          PYTHONUNBUFFERED: "1"
          COMPS_DB: .cache/bazar-comps-v2.sqlite
      - name: Fetch Vinted
        if: steps.batch.outputs.needs_fetch == '1'
        continue-on-error: true
        run: python -u -m bazar_deals hunt --source vinted --fetch-only --listings-out .cache/hunt-vinted.json
        env:
          PYTHONUNBUFFERED: "1"
          COMPS_DB: .cache/bazar-comps-v2.sqlite
      - name: Fetch sbazar
        if: steps.batch.outputs.needs_fetch == '1'
        continue-on-error: true
        run: python -u -m bazar_deals hunt --source sbazar --fetch-only --listings-out .cache/hunt-sbazar.json
        env:
          PYTHONUNBUFFERED: "1"
          COMPS_DB: .cache/bazar-comps-v2.sqlite
      - name: Fetch eBay
        if: steps.batch.outputs.needs_fetch == '1'
        continue-on-error: true
        run: python -u -m bazar_deals hunt --source ebay --fetch-only --listings-out .cache/hunt-ebay.json
        env:
          PYTHONUNBUFFERED: "1"
          COMPS_DB: .cache/bazar-comps-v2.sqlite
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_RETENTION_ENABLED: "true"
      - name: Fetch Facebook
        if: steps.batch.outputs.needs_fetch == '1'
        continue-on-error: true
        run: python -u -m bazar_deals hunt --source facebook --fetch-only --listings-out .cache/hunt-facebook.json
        env:
          PYTHONUNBUFFERED: "1"
          COMPS_DB: .cache/bazar-comps-v2.sqlite
      - name: Fetch OLX
        if: steps.batch.outputs.needs_fetch == '1'
        continue-on-error: true
        run: python -u -m bazar_deals hunt --source olx --fetch-only --listings-out .cache/hunt-olx.json
        env:
          PYTHONUNBUFFERED: "1"
          COMPS_DB: .cache/bazar-comps-v2.sqlite
      - name: Score, 0-BUY loop, and comment
        id: score
        run: python -u -m bazar_deals hunt --batch-url "$HUNT_BATCH_URL" --listings-in .cache/hunt-bazos.json --listings-in .cache/hunt-aukro.json --listings-in .cache/hunt-vinted.json --listings-in .cache/hunt-sbazar.json --listings-in .cache/hunt-ebay.json --listings-in .cache/hunt-facebook.json --listings-in .cache/hunt-olx.json --notify
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ALERT_ISSUE: "1"
          GITHUB_ASSIGNEE: babulic
          EUR_CZK: ${{ vars.EUR_CZK }}
          EUR_PLN: ${{ vars.EUR_PLN }}
          COMPS_DB: .cache/bazar-comps-v2.sqlite
          HUNT_BATCH_URL: ${{ vars.EBAY_STORE_URL }}
          HUNT_BATCH_TOKEN: ${{ secrets.EBAY_STORE_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_RETENTION_ENABLED: "true"
          AI_PROVIDER: copilot
          COPILOT_MODEL: auto
          AI_REVIEW_ENABLED: "true"
          AI_REVIEW_REQUIRED: "true"
      - name: Save price book checkpoint
        uses: actions/cache/save@v4
        with:
          path: .cache/bazar-comps-v2.sqlite
          key: sold-comps-fx-v3-${{ github.run_id }}
      - name: Save FX checkpoint
        uses: actions/cache/save@v4
        with:
          path: .cache/ecb-fx.json
          key: ecb-fx-hunt-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Start the next page or fresh batch
        if: steps.score.outputs.dispatch_next == '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/hunt.yml/dispatches" \
            --data '{"ref":"main","inputs":{"continuation":"true"}}'
