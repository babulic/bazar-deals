name: Source smoke

on:
  push:
    branches: [fix/live-marketplace-ai]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  copilot-requests: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe Aukro newest sort
        run: |
          python - <<'PY' | tee /tmp/diag.txt
          import json
          import urllib.request
          print("<!-- source-smoke-v3 -->")
          print("## Source smoke v3")
          headers={"User-Agent":"Mozilla/5.0 AppleWebKit/537.36 Chrome/139 Safari/537.36","Accept":"application/json","Content-Type":"application/json"}
          payload=json.dumps({"fallbackItemsCount":12,"splitGroupKey":"listing","splitGroupValue":"A18"}).encode()
          for sort in ["", "&sort=-startTime"]:
              url="https://backend.aukro.cz/backend-web/api/offers/searchItemsCommon?page=0&size=20"+sort
              try:
                  req=urllib.request.Request(url,data=payload,method="POST",headers=headers)
                  with urllib.request.urlopen(req,timeout=30) as r:
                      data=json.loads(r.read().decode())
                      content=data.get("content",[])
                      buy=[x for x in content if x.get("buyNowActive") and not x.get("auction") and not x.get("adultContent")]
                      print("AUKRO sort", sort or "default", "status", r.status, "buy", len(buy))
                      print("AUKRO times", [x.get("startingTime") for x in buy[:8]])
                      if buy:
                          item=buy[0]
                          detail_url=f"https://aukro.sk/{item.get('seoUrl')}-{item.get('itemId')}"
                          dreq=urllib.request.Request(detail_url,headers={"User-Agent":headers["User-Agent"],"Accept":"text/html"})
                          with urllib.request.urlopen(dreq,timeout=30) as dr:
                              body=dr.read().decode("utf-8","replace")
                              print("AUKRO detail", dr.status, "bytes", len(body), "jsonld", body.count('application/ld+json'), "description_markers", body.count('description'))
              except Exception as exc:
                  print("AUKRO sort", sort or "default", "ERROR", type(exc).__name__, str(exc)[:500])
          PY
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Probe Copilot web tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          prompt='Use web search to identify the official GitHub domain. Return JSON only: {"ok":true,"domain":"github.com","source_urls":["https://..."]}'
          copilot -p "$prompt" -s --no-ask-user --available-tools='web_search,web_fetch' --allow-all-urls > /tmp/copilot-out.txt 2>/tmp/copilot-err.txt
          code=$?
          {
            echo "COPILOT web exit=$code"
            echo "COPILOT web stdout: $(head -c 1600 /tmp/copilot-out.txt)"
            echo "COPILOT web stderr: $(head -c 1200 /tmp/copilot-err.txt)"
          } | tee -a /tmp/diag.txt
          exit 0
      - name: Post diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 1 --repo "${{ github.repository }}" --body-file /tmp/diag.txt
