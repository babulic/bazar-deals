name: Source smoke

on:
  push:
    branches: [fix/live-marketplace-ai]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  copilot-requests: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Smoke live clients and AI reviewer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_PROVIDER: copilot
          AI_REVIEW_ENABLED: "true"
          AI_REVIEW_REQUIRED: "true"
          COMPS_DB: /tmp/source-smoke.sqlite
        run: |
          python - <<'PY' | tee /tmp/diag.txt
          from decimal import Decimal
          from bazar_deals.adapters.aukro import AukroHuntClient
          from bazar_deals.adapters.vinted import VintedHuntClient
          from bazar_deals.ai_review import AIReviewClient
          from bazar_deals.config import Settings
          from bazar_deals.domain import Condition, IdentifiedItem, Listing, Marketplace, Money
          from bazar_deals.scoring import score_deal

          print('<!-- source-smoke-v4 -->')
          print('## Source smoke v4')
          settings = Settings()

          vinted = VintedHuntClient(settings).fetch_new()
          print('VINTED count', len(vinted))
          if vinted:
              print('VINTED first', vinted[0].external_id, vinted[0].title[:120], vinted[0].price.amount, vinted[0].price.currency)

          aukro = AukroHuntClient(settings).fetch_new()
          print('AUKRO count', len(aukro))
          if aukro:
              print('AUKRO first', aukro[0].external_id, aukro[0].title[:120], aukro[0].price.amount, aukro[0].price.currency)

          assert len(vinted) > 0, 'Vinted parser returned zero live listings'
          assert len(aukro) > 0, 'Aukro client returned zero live listings'

          listing = Listing(
              marketplace=Marketplace.VINTED,
              external_id='smoke-ai',
              title='Apple iPhone SE 2020 64 GB black',
              description='Used complete phone, battery 77%, no box.',
              url='https://www.vinted.sk/',
              price=Money(amount=Decimal('45'), currency='EUR'),
              condition=Condition.USED,
          )
          item = IdentifiedItem(
              listing=listing,
              vertical=None,
              canonical_name='Apple iPhone SE 2020 64 GB',
              model='iphone se 2020 64gb',
              search_query='iphone se 2020 64gb',
              asking_sample=8,
              kind='phones',
              sold_label='smoke deterministic P25',
              confidence=0.9,
          )
          deal = score_deal(item, Decimal('90'), Decimal('6'), settings=settings)
          review = AIReviewClient(settings, db_path='/tmp/source-smoke.sqlite').review(deal)
          print('AI approved', review.approved)
          print('AI complete_product', review.complete_product)
          print('AI canonical', review.canonical_name)
          print('AI price', review.quick_sale_price_eur)
          print('AI confidence', review.confidence)
          print('AI sources', len(review.source_urls))
          print('AI model', review.model)
          assert review.canonical_name
          assert review.source_urls, 'Copilot reviewer returned no web evidence'
          PY
      - name: Post diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/diag.txt ]; then
            gh issue comment 1 --repo "${{ github.repository }}" --body-file /tmp/diag.txt
          fi
