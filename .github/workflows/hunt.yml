name: Hunt alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  copilot-requests: write

concurrency:
  group: hunt-alerts
  cancel-in-progress: true

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure bazar-alert label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create bazar-alert \
            --repo "${{ github.repository }}" \
            --description "Automatické hunt alerty" \
            --color D93F0B \
            --force
      - uses: actions/cache@v4
        with:
          path: .cache/bazar-comps-v2.sqlite
          key: sold-comps-fx-v3-${{ github.run_id }}
          restore-keys: |
            sold-comps-fx-v3-
      - uses: actions/cache@v4
        with:
          path: .cache/ecb-fx.json
          key: ecb-fx-hunt-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ecb-fx-
      - run: python -m pip install -e .
      - name: Install Copilot CLI for final AI verification
        run: npm install -g @github/copilot
      - name: Ensure price book DB exists
        env:
          COMPS_DB: .cache/bazar-comps-v2.sqlite
        run: python -c "from bazar_deals.soldcomps import SoldCompClient; SoldCompClient()"
      - name: Fetch Bazos
        continue-on-error: true
        run: python -u -m bazar_deals hunt --source bazos --fetch-only --listings-out .cache/hunt-bazos.json
        env:
          PYTHONUNBUFFERED: "1"
          COMPS_DB: .cache/bazar-comps-v2.sqlite
      - name: Fetch Aukro
        continue-on-error: true
        run: python -u -m bazar_deals hunt --source aukro --fetch-only --listings-out .cache/hunt-aukro.json
        env:
          PYTHONUNBUFFERED: "1"
          COMPS_DB: .cache/bazar-comps-v2.sqlite
      - name: Fetch Vinted
        continue-on-error: true
        run: python -u -m bazar_deals hunt --source vinted --fetch-only --listings-out .cache/hunt-vinted.json
        env:
          PYTHONUNBUFFERED: "1"
          COMPS_DB: .cache/bazar-comps-v2.sqlite
      - name: Fetch sbazar
        continue-on-error: true
        run: python -u -m bazar_deals hunt --source sbazar --fetch-only --listings-out .cache/hunt-sbazar.json
      - name: Fetch facebook
        continue-on-error: true
        run: python -u -m bazar_deals hunt --source facebook --fetch-only --listings-out .cache/hunt-facebook.json
      - name: Fetch allegro_pl
        continue-on-error: true
        run: python -u -m bazar_deals hunt --source allegro_pl --fetch-only --listings-out .cache/hunt-allegro_pl.json
        env:
          ALLEGRO_ACCESS_TOKEN: ${{ secrets.ALLEGRO_ACCESS_TOKEN }}
          ALLEGRO_CLIENT_ID: ${{ secrets.ALLEGRO_CLIENT_ID }}
          ALLEGRO_CLIENT_SECRET: ${{ secrets.ALLEGRO_CLIENT_SECRET }}
          ALLEGRO_LISTING_ACCESS_CONFIRMED: ${{ vars.ALLEGRO_LISTING_ACCESS_CONFIRMED || 'false' }}
      - name: Fetch allegro_sk
        continue-on-error: true
        run: python -u -m bazar_deals hunt --source allegro_sk --fetch-only --listings-out .cache/hunt-allegro_sk.json
        env:
          ALLEGRO_ACCESS_TOKEN: ${{ secrets.ALLEGRO_ACCESS_TOKEN }}
          ALLEGRO_CLIENT_ID: ${{ secrets.ALLEGRO_CLIENT_ID }}
          ALLEGRO_CLIENT_SECRET: ${{ secrets.ALLEGRO_CLIENT_SECRET }}
          ALLEGRO_LISTING_ACCESS_CONFIRMED: ${{ vars.ALLEGRO_LISTING_ACCESS_CONFIRMED || 'false' }}
      - name: Fetch olx
        continue-on-error: true
        run: python -u -m bazar_deals hunt --source olx --fetch-only --listings-out .cache/hunt-olx.json
      - name: Score and comment
        run: python -u -m bazar_deals hunt --listings-in .cache/hunt-bazos.json --listings-in .cache/hunt-aukro.json --listings-in .cache/hunt-vinted.json --listings-in .cache/hunt-sbazar.json --listings-in .cache/hunt-facebook.json --listings-in .cache/hunt-allegro_pl.json --listings-in .cache/hunt-allegro_sk.json --listings-in .cache/hunt-olx.json --notify
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ALERT_ISSUE: "1"
          GITHUB_ASSIGNEE: babulic
          MAX_BUY_EUR: "110"
          EUR_CZK: ${{ vars.EUR_CZK }}
          EUR_PLN: ${{ vars.EUR_PLN }}
          MIN_BUY_EUR: "20"
          MIN_NET_PROFIT_EUR: "30"
          MAX_SHIPPING_EUR: "15"
          CHEAP_BUY_EUR: "20"
          MAX_SHIPPING_CHEAP_EUR: "11"
          RESALE_FEE_RATE: "0.10"
          SELLER_RISK_RESERVE_RATE: "0.05"
          NO_BOX_HAIRCUT_EUR: "5"
          COMPS_DB: .cache/bazar-comps-v2.sqlite
          COMPS_TTL_DAYS: "7"
          AI_PROVIDER: copilot
          COPILOT_MODEL: auto
          AI_REVIEW_ENABLED: "true"
          AI_REVIEW_REQUIRED: "true"
          AI_MAX_REVIEWS: "8"
          AI_MAX_IDENTIFICATIONS: "12"
          AI_REVIEW_TTL_DAYS: "14"
          AI_MIN_CONFIDENCE: "0.75"
