name: Hunt alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  copilot-requests: write

jobs:
  cleanup:
    uses: ./.github/workflows/delete-issue-comments.yml
    with:
      issue_number: "1"

  hunt:
    needs: cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure bazar-alert label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create bazar-alert \
            --repo "${{ github.repository }}" \
            --description "Automatické hunt alerty" \
            --color D93F0B \
            --force
      - uses: actions/cache@v4
        with:
          path: .cache/bazar-comps-v2.sqlite
          key: sold-comps-v2-${{ github.run_id }}
          restore-keys: |
            sold-comps-v2-
      - run: python -m pip install -e .
      - name: Install Copilot CLI for final AI verification
        run: npm install -g @github/copilot
      - name: Ensure conservative price DB exists
        env:
          COMPS_DB: .cache/bazar-comps-v2.sqlite
        run: python -c "from bazar_deals.soldcomps import SoldCompClient; SoldCompClient()"
      - name: Warn when eBay secrets are missing
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          if [ -z "$EBAY_CLIENT_ID" ] || [ -z "$EBAY_CLIENT_SECRET" ]; then
            echo "::warning::EBAY_CLIENT_ID is not set in repo Actions secrets. eBay hunt is skipped and sold comps cannot use the Browse API."
            exit 0
          fi
          CODE=$(curl -sS -o /tmp/ebay-oauth.json -w "%{http_code}" \
            -u "${EBAY_CLIENT_ID}:${EBAY_CLIENT_SECRET}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "scope=https://api.ebay.com/oauth/api_scope" \
            https://api.ebay.com/identity/v1/oauth2/token || true)
          if [ "$CODE" != "200" ]; then
            echo "::warning::eBay OAuth HTTP ${CODE} — secrets are present but eBay rejected them. Use the production App ID (Client ID) and Cert ID (Client Secret), not sandbox and not Dev ID. Response: $(tr '\n' ' ' < /tmp/ebay-oauth.json)"
          fi
      - name: Hunt all marketplaces
        run: python -m bazar_deals hunt --source all --notify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ALERT_ISSUE: "1"
          GITHUB_ASSIGNEE: babulic
          MAX_BUY_EUR: "110"
          MIN_BUY_EUR: "20"
          MIN_NET_PROFIT_EUR: "30"
          MAX_SHIPPING_EUR: "15"
          CHEAP_BUY_EUR: "20"
          MAX_SHIPPING_CHEAP_EUR: "11"
          RESALE_FEE_RATE: "0.10"
          SELLER_RISK_RESERVE_RATE: "0.05"
          NO_BOX_HAIRCUT_EUR: "5"
          COMPS_DB: .cache/bazar-comps-v2.sqlite
          COMPS_TTL_DAYS: "7"
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_CAMPAIGN_ID: ${{ secrets.EBAY_CAMPAIGN_ID }}
          AI_PROVIDER: copilot
          COPILOT_MODEL: auto
          AI_REVIEW_ENABLED: "true"
          AI_REVIEW_REQUIRED: "true"
          AI_MAX_REVIEWS: "8"
          AI_MAX_IDENTIFICATIONS: "12"
          AI_REVIEW_TTL_DAYS: "14"
          AI_MIN_CONFIDENCE: "0.75"
