  # Packeta public list prices, EUR excluding VAT, parcel up to 5 kg. Business
  # rates are contractual and always lower -- override these with the real ones
  # from the client zone before trusting any margin number.
  packeta:
    max_weight_kg: 10
    fuel_surcharge_rate: 0.165
    toll_eur_per_kg: 0.04
    destinations:
      SK: {pickup: 2.30, home: 3.60, schengen: true}
