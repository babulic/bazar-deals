        - druza
        - agregát
        - agregat
        - polymetál
        - polymetal
        - ryolit
        - pegmatit
        - minerál
        - mineral
      # Collectors search species plus locality, so both belong in the title.
      locality_in_title: true
      lead_with_part_number: false
      # Spent only on the leftover character budget of the wider channels.
      filler_keywords: [zberateľský, nepoškodený]
    retro:
      keywords:
        - commodore
        - c64
        - c64c
        - c64g
        - amiga
        - atari
