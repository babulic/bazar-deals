# All hunt lists, maps, and numeric defaults.
# Secrets stay in .env (tokens, API keys). Optional overlay: ./bazar.yaml or BAZAR_CONFIG.

domain:
  marketplaces: [ebay, aukro, bazos, vinted, sbazar, facebook, allegro_pl, allegro_sk, olx]
  verticals: [retro, mineral, apple, network]
  conditions: [new, like_new, used, for_parts, unknown]
  actions: [buy, alert, skip]
  item_kinds:
    - media
    - books
    - accessories
    - clothing
    - jewelry
    - minerals
    - collectibles
    - bags
    - kitchen
    - stationery
    - cosmetics
    - toys
    - sports
    - photo
    - phones
    - musical
    - tools
    - hardware
    - generic
  default_currency: EUR

hunt:
  max_buy_eur: 110
  min_buy_eur: 20
  # Packeta shoebox: 2 kg, longest edge 50 cm, L+W+H <= 120 cm (e.g. 50x40x30).
  max_weight_kg: 2
  max_edge_cm: 50
  max_sum_cm: 120
  max_price_vs_typical: 0.5
  alert_price_vs_typical: 1.0
  min_sold_sample: 5
  # Counts unique normalized product queries, not duplicate listings.
  max_sold_lookups: 80
  # Detail-fetching every usable ad does not finish in GitHub Actions.
  # This cap is expensive work (detail HTTP + live comps), not cache hits.
  # Ads without 5 comps do not consume it.
  max_score_listings: 80
  # Names used to recognise a hunt-target ad (dump matching / scoring).
  # Marketplace search uses fetch_queries, not these bare keywords.
  target_queries:
    - iphone
    - airpods
    - apple watch
    - ipad
    - samsung galaxy
    - nintendo switch
    - steam deck
    - gameboy
    - canon
    - commodore
    - c64
    - mos 6510
    - ametyst
    - gopro
    - dji mini
    - garmin
    - pixel
    - insta360
    - quest 2
    - nothing phone
    - switch oled
    - airpods pro
    - canon eos
    - tamron
    - vltavín
    - galenit
    - kindle
    - galaxy s21
  # Marketplace search: high-turnover SKUs that still sit in 20–110 € and can
  # clear 20 € net. EU refurbished volume is iPhone 11/12/13, then AirPods,
  # Apple Watch, Switch Lite, Galaxy S21/S22. Clothing is never searched.
  # Bare `commodore` / `c64` stay in target_queries only.
  fetch_queries:
    - iphone se
    - iphone 11
    - iphone 12
    - iphone 13
    - airpods pro
    - airpods
    - apple watch se
    - apple watch
    - nintendo switch lite
    - switch oled
    - galaxy s21
    - galaxy s22
    - pixel 7a
    - sony wh-1000
    - gopro
    - kindle
    - commodore 1541
    - 1541-ii
    - commodore 64 computer
    - quest 2
    - garmin
    - canon eos
    - ametyst
  # Second-wave SKUs after a 0 BUY hunt. Still electronics/photo/hardware, not fashion.
  expand_queries:
    - iphone 14
    - nothing phone
    - galaxy buds
    - nintendo 3ds
    - gameboy
    - insta360
    - sigma 18-50
    - tamron
    - dji mini
    - c64c
    - mos 6510
    - vltavín
    - galenit
    - steam deck
    - dremel
    - galaxy watch
  default_shipping_eur: 8
  max_shipping_eur: 15
  cheap_buy_eur: 20
  max_shipping_cheap_eur: 11
  min_net_profit_eur: 20
  min_margin: 0.25
  eur_usd: 1.08
  user_agent: "bazar-deals/0.1 (+https://github.com/babulic/bazar-deals)"
  request_gap_seconds: 2.0
  comps_db: .cache/bazar-comps.sqlite
  comps_ttl_days: 7

github:
  alert_issue_title: Deal alerts
  alert_label: bazar-alert
  alert_issue: 0
  assignee: ""
  # Max cards in one hunt comment: BUY first, then still-profitable (net > 0)
  # under the 20 € floor. Losses stay out.
  alert_top_n: 5
  sell_alert_issue_title: Sell buyers
  sell_alert_label: bazar-sell
  sell_alert_issue: 0

fees:
  rates:
    ebay: 0.13
    aukro: 0.11
    bazos: 0
    vinted: 0.05
  buy_side: [vinted]
  vinted_fixed_eur: 0.70

