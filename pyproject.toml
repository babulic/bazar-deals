[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bazar-deals"
version = "0.1.0"
description = "Marketplace mispricing hunter for SK/CZ bazars and eBay"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "flask>=3.1", "cryptography>=44"]
server = ["flask>=3.1", "gunicorn>=23", "cryptography>=44"]

[project.scripts]
bazar-deals = "bazar_deals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bazar_deals = ["data/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
