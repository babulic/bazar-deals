name: Wipe alert comments

# One-shot: this Cloud Agent token cannot DELETE issue comments (needs issues:write).
# Pushing this branch runs the job with the repo GITHUB_TOKEN. Do not merge.
on:
  push:
    branches: [cursor/delete-alert-comments-f078]

permissions:
  contents: read
  issues: write

jobs:
  wipe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete all comments from issues 1 and 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          for ISSUE in 1 12; do
            echo "Deleting comments from issue #$ISSUE in $REPO ..."
            DELETED=0
            while true; do
              COMMENTS=$(gh api "repos/$REPO/issues/$ISSUE/comments?per_page=100" --jq '.[].id')
              if [ -z "$COMMENTS" ]; then
                break
              fi
              for ID in $COMMENTS; do
                gh api -X DELETE "repos/$REPO/issues/comments/$ID"
                DELETED=$((DELETED + 1))
              done
            done
            echo "Deleted $DELETED comments from issue #$ISSUE"
          done
