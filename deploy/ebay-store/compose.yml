services:
  store:
    build:
      context: ../..
      dockerfile: deploy/ebay-store/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 64
  https:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    mem_limit: 192m
    pids_limit: 64
